services:
  - type: web
    name: chater-appweb
    runtime: static
    buildCommand: python tools/generate-release.py --require-backend
    staticPublishPath: .
    envVars:
      - key: APP_BACKEND_URL
        sync: false
    headers:
      - path: /runtime-config.js
        name: Cache-Control
        value: public, max-age=300, stale-while-revalidate=3600
      - path: /sw.js
        name: Cache-Control
        value: public, max-age=300, must-revalidate
      - path: /index.html
        name: Cache-Control
        value: public, max-age=60, stale-while-revalidate=300
      - path: /styles.css
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /theme-bootstrap.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /app.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /api.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /firebase.auth.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /APPwebFRONTENDx/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /LINKminiaturasx/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /LINKcontactosCHATERx/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /IMAGENwebpCOMPRESIONx/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

