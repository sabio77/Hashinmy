<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#128C7E" />
  <title>Sin conexión</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f3f5f4; color: #17201d; }
    main { width: min(92vw, 520px); padding: 32px; border-radius: 24px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.08); text-align: center; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 8vw, 4rem); }
    p { margin: 0; line-height: 1.55; color: #50615b; }
    @media (prefers-color-scheme: dark) { body { background:#071310; color:#eef7f4; } main { background:#10211d; } p { color:#b9c9c4; } }
  </style>
</head>
<body>
  <main>
    <h1>Hola mundo</h1>
    <p>Estás sin conexión. La app instalada seguirá funcionando con la última versión guardada y se actualizará al recuperar internet.</p>
  </main>
</body>
</html>
