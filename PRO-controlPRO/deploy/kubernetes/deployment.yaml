apiVersion: apps/v1
kind: Deployment
metadata:
  name: semilla-appweb-pwa
  labels:
    app: semilla-appweb-pwa
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: semilla-appweb-pwa
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: semilla-appweb-pwa
    spec:
      containers:
        - name: web
          image: ghcr.io/tu-organizacion/semilla-appweb-pwa:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health.json
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health.json
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi
