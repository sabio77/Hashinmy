server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/manifest+json application/wasm image/svg+xml;

  location = / {
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    try_files /index.html =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location = /health.json {
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    default_type application/manifest+json;
    try_files $uri =404;
  }

  location ^~ /src/ {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location ^~ /textX/ {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
